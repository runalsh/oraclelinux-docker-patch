name: Build and Push Oracle Linux Patch Images to DockerHub

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install QEMU, LVM dependencies and Python pip
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-utils lvm2 xfsprogs e2fsprogs parted python3-pip python3-setuptools

      - name: Make build script executable
        run: chmod +x build.sh

      - name: Build, verify and push images
        env:
          TEST_VERSION: 'true'
          PUSH_TO_DOCKERHUB: 'true'
        run: ./build.sh
