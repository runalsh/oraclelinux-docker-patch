name: Auto Discover New Oracle Linux Point Releases

on:
  schedule:
    # Run once every 7 days (every Sunday at 03:00 UTC)
    - cron: '0 3 * * 0'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Scan Oracle Yum for new Oracle Linux point releases
        run: python3 discover_new_releases.py

      - name: Create Pull Request if new release discovered
        if: env.NEW_RELEASE_FOUND == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat: auto-discovered new Oracle Linux release ${{ env.NEW_TAG }}"
          title: "🚀 New Oracle Linux Release Discovered: ${{ env.NEW_TAG }}"
          body: |
            Automated release discovery detected a new Oracle Linux point release: **${{ env.NEW_TAG }}**.

            - **Version Tag**: `${{ env.NEW_TAG }}`
            - **Oracle Template URL**: `${{ env.NEW_URL }}`

            `releases.txt` and `README.md` have been updated with the new release URL.
            
            Please review and merge this PR to trigger automated container build and publishing to Docker Hub and GHCR.
          branch: "auto-discover-${{ env.NEW_TAG }}"
          reviewers: "${{ github.repository_owner }}"
